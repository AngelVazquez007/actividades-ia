<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Perceptrón con 2 Clases</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        canvas { border: 1px solid black; }
        textarea { width: 100%; height: 150px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Clasificación con Perceptrón</h2>

    <h3>Ingresa los puntos para la Clase 0:</h3>
    <textarea id="inputClase0" placeholder="Ejemplo:&#10;0.5,0.6&#10;1.2,1.4&#10;..."></textarea>

    <h3>Ingresa los puntos para la Clase 1:</h3>
    <textarea id="inputClase1" placeholder="Ejemplo:&#10;1.5,1.7&#10;2.2,2.3&#10;..."></textarea>

    <p><button onclick="entrenarYGraficar()">Entrenar y Graficar</button></p>
    <canvas id="grafica" width="600" height="400"></canvas>
    <p id="pesos"></p>

    <script>
        function parsearDatos() {
            const textoClase0 = document.getElementById("inputClase0").value.trim();
            const textoClase1 = document.getElementById("inputClase1").value.trim();

            const puntosClase0 = textoClase0.split("\n").filter(l => l.includes(",")).map(linea => {
                const [x, y] = linea.split(",").map(Number);
                return { x, y };
            });

            const puntosClase1 = textoClase1.split("\n").filter(l => l.includes(",")).map(linea => {
                const [x, y] = linea.split(",").map(Number);
                return { x, y };
            });

            if (puntosClase0.length === 0 || puntosClase1.length === 0) {
                alert("Debe ingresar al menos un punto para cada clase.");
                return null;
            }

            return { clase0: puntosClase0, clase1: puntosClase1 };
        }

        function entrenarPerceptron(X, y) {
            let w = [Math.random(), Math.random()];
            let b = Math.random();
            const eta = 0.1;

            const forward = (x) => {
                const suma = w[0]*x[0] + w[1]*x[1] + b;
                return suma > 0 ? 1 : 0;
            };

            for (let epoch = 0; epoch < 200; epoch++) {
                for (let i = 0; i < X.length; i++) {
                    const y_pred = forward(X[i]);
                    const error = y[i] - y_pred;
                    w[0] += eta * error * X[i][0];
                    w[1] += eta * error * X[i][1];
                    b += eta * error;
                }
            }

            return { w, b };
        }

        function entrenarYGraficar() {
            const datos = parsearDatos();
            if (!datos) return;

            const { clase0, clase1 } = datos;
            const X = [...clase0, ...clase1].map(p => [p.x, p.y]);
            const y = Array(clase0.length).fill(0).concat(Array(clase1.length).fill(1));

            const { w, b } = entrenarPerceptron(X, y);

            document.getElementById("pesos").innerText =
                `w0 (bias): ${b.toFixed(2)}, w1: ${w[0].toFixed(2)}, w2: ${w[1].toFixed(2)}`;

            const x_vals = [-40, 40];
            const y_vals = x_vals.map(x => -(w[0]*x + b) / w[1]);

            const ctx = document.getElementById('grafica').getContext('2d');
            new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [
                        {
                            label: 'Clase 0',
                            data: clase0,
                            backgroundColor: 'red',
                            pointRadius: 4
                        },
                        {
                            label: 'Clase 1',
                            data: clase1,
                            backgroundColor: 'blue',
                            pointRadius: 4
                        },
                        {
                            label: 'Frontera de decisión',
                            type: 'line',
                            data: [
                                { x: x_vals[0], y: y_vals[0] },
                                { x: x_vals[1], y: y_vals[1] }
                            ],
                            borderColor: 'green',
                            borderWidth: 2,
                            fill: false,
                            showLine: true
                        }
                    ]
                },
                options: {
                    scales: {
                        x: { min: -50, max: 50 },
                        y: { min: -50, max: 50 }
                    }
                }
            });
        }
    </script>
</body>
